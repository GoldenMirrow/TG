<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TG Indexer</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>
  <!-- HEADER -->
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">
        <div class="brand-logo">📚</div>
        <div class="brand-text">
          <h1>TG Indexer</h1>
          <span>Biblioteca personal</span>
        </div>
      </a>

      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="search" id="searchInput" placeholder="Buscar por nombre, serie, autor...">
        <kbd class="search-kbd">/</kbd>
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" id="statsBtn" title="Estadísticas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3v18h18"/><path d="M7 12l4-4 4 4 6-6"/>
          </svg>
        </button>
        <button class="icon-btn" id="thumbsBtn" title="Indexar thumbnails">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>
          </svg>
        </button>
        <button class="icon-btn" id="scanBtn" title="Escanear">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <nav class="nav-section">
        <h3>Biblioteca</h3>
        <button class="nav-item active" data-db="all">
          <span class="nav-icon">🗂️</span>
          <span>Todos</span>
          <span class="nav-count" id="countAll">-</span>
        </button>
        <button class="nav-item" data-db="videos">
          <span class="nav-icon">🎬</span>
          <span>Videos</span>
          <span class="nav-count" id="countVideos">-</span>
        </button>
        <button class="nav-item" data-db="mangas">
          <span class="nav-icon">📚</span>
          <span>Mangas</span>
          <span class="nav-count" id="countMangas">-</span>
        </button>
        <button class="nav-item" data-db="otros">
          <span class="nav-icon">⚙️</span>
          <span>Otros</span>
          <span class="nav-count" id="countOtros">-</span>
        </button>
      </nav>

      <nav class="nav-section">
        <h3>Filtros</h3>
        <label class="filter-label">Ordenar por</label>
        <select id="sortSelect" class="filter-select">
          <option value="size_desc">Tamaño (mayor → menor)</option>
          <option value="size_asc">Tamaño (menor → mayor)</option>
          <option value="date_desc">Reciente primero</option>
          <option value="date_asc">Antiguo primero</option>
          <option value="name_asc">Nombre (A → Z)</option>
          <option value="name_desc">Nombre (Z → A)</option>
        </select>

        <label class="filter-label">Extensión</label>
        <input type="text" id="extInput" class="filter-input" placeholder="pdf, mp4, cbz...">

        <label class="filter-label">Serie</label>
        <input type="text" id="seriesInput" class="filter-input" placeholder="One Piece...">

        <label class="filter-label">Tamaño mínimo (MB)</label>
        <input type="number" id="minSizeInput" class="filter-input" placeholder="0" min="0">
      </nav>

      <button class="btn-clear" id="clearFilters">Limpiar filtros</button>
    </aside>

    <!-- CONTENT -->
    <main class="content">
      <div class="content-header">
        <h2 id="resultsTitle">Todos los archivos</h2>
        <span class="results-count" id="resultsCount">-</span>
      </div>
      <div id="results" class="results-grid">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Cargando...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- MODALS -->
  <dialog id="detailModal" class="modal">
    <div class="modal-content detail-modal">
      <button class="modal-close" data-close="detailModal">✕</button>
      <div id="detailBody"></div>
    </div>
  </dialog>

  <dialog id="statsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📊 Estadísticas</h3>
        <button class="modal-close" data-close="statsModal">✕</button>
      </div>
      <div id="statsBody" class="modal-body"></div>
    </div>
  </dialog>

  <dialog id="scanModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🔄 Escanear</h3>
        <button class="modal-close" data-close="scanModal">✕</button>
      </div>
      <div class="modal-body">
        <label class="filter-label">Modo</label>
        <select id="scanMode" class="filter-select">
          <option value="new">new (solo nuevos)</option>
          <option value="force">force (desde cero)</option>
        </select>
        <label class="filter-label">Canal (opcional)</label>
        <input type="text" id="scanChannel" class="filter-input" placeholder="@canal">
        <button id="scanStart" class="btn-primary">Iniciar escaneo</button>
        <div id="scanStatus" class="status-line"></div>
      </div>
    </div>
  </dialog>

  <dialog id="thumbsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🖼️  Indexar thumbnails</h3>
        <button class="modal-close" data-close="thumbsModal">✕</button>
      </div>
      <div class="modal-body">
        <label class="filter-label">DB</label>
        <select id="thumbsDb" class="filter-select">
          <option value="all">Todas</option>
          <option value="videos">Videos</option>
          <option value="mangas">Mangas</option>
        </select>
        <label class="filter-label">Límite</label>
        <input type="number" id="thumbsLimit" class="filter-input" value="100">
        <button id="thumbsStart" class="btn-primary">Descargar</button>
        <div id="thumbsStatus" class="status-line"></div>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
